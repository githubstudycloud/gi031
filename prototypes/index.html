<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>gi031 · 报表平台原型 (v2)</title>
<style>
  :root {
    --bg: #f4f6fb;
    --bg-elev: #ffffff;
    --panel: #ffffff;
    --border: #e3e7ee;
    --border-strong: #c9d0db;
    --text: #0f172a;
    --text-soft: #475569;
    --muted: #94a3b8;
    --primary: #2563eb;
    --primary-600: #1d4ed8;
    --primary-50: #eff6ff;
    --primary-100: #dbeafe;
    --success: #16a34a;
    --warning: #d97706;
    --warning-soft: #fef3c7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --gold: #f59e0b;
    --gold-deep: #b45309;
    --gold-soft: #fef9c3;
    --row-stripe: #fafbfd;
    --row-hover: #eff6ff;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
    --shadow: 0 4px 12px rgba(15,23,42,.08);
    --shadow-lg: 0 16px 32px rgba(15,23,42,.18);
    --th-h-1: 32px;
    --th-h-2: 30px;
    --th-h-3: 30px;
    --th-h-4: 30px;
    --topbar-h: 56px;
    --filter-h: 64px;
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;
    font-feature-settings: "tnum" 1, "ss01" 1; }
  table { font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  input, select { font: inherit; }
  .app { max-width: 1480px; margin: 0 auto; padding: 0 20px 24px; }

  /* === Sticky top stack === */
  .sticky-top {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 70%, rgba(244,246,251,0) 100%);
    padding-top: 16px;
    margin: 0 -20px; padding-left: 20px; padding-right: 20px;
  }
  .topbar { display: flex; align-items: center; gap: 12px; min-height: var(--topbar-h); padding: 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .topbar .sub { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .topbar .grow { flex: 1; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .v-banner { background: var(--danger-soft); color: var(--danger); padding: 6px 12px; border-radius: var(--r-md);
    font-size: 12px; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
  .v-banner b { font-weight: 600; }

  /* === Buttons === */
  .btn { background: #fff; border: 1px solid var(--border-strong); border-radius: var(--r-sm);
    padding: 5px 12px; color: var(--text); transition: all .12s; display: inline-flex; align-items: center; gap: 5px; line-height: 1.4; }
  .btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-50); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
  .btn.primary:hover { background: var(--primary-600); border-color: var(--primary-600); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-soft); padding: 5px 8px; }
  .btn.ghost:hover { color: var(--primary); background: var(--primary-50); border-color: transparent; }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn.icon { padding: 4px 7px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn .badge { background: var(--primary-100); color: var(--primary-600); border-radius: 999px; padding: 0 6px; font-size: 11px; font-weight: 600; }

  /* === Filter bar === */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-sm); }
  .filterbar { padding: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > label { font-size: 11px; color: var(--text-soft); font-weight: 500; }
  .field-input { display: flex; align-items: center; gap: 6px; padding: 5px 9px; min-height: 30px;
    border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: #fff; min-width: 200px; cursor: pointer; transition: border-color .12s; }
  .field-input:hover { border-color: var(--primary); }
  .field-input.active, .field-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-50); }
  .field-input input { border: 0; outline: 0; background: transparent; flex: 1; font: inherit; min-width: 60px; }
  .chip { background: var(--primary-50); color: var(--primary-600); border-radius: 999px; padding: 1px 8px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .chip .x { color: var(--muted); cursor: pointer; line-height: 1; padding: 0 2px; }
  .chip .x:hover { color: var(--danger); }
  .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* === Version pill === */
  .ver-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 12px;
    border: 1px solid var(--border-strong); border-radius: 999px; background: #fff; cursor: pointer; transition: all .12s; }
  .ver-pill:hover { border-color: var(--primary); color: var(--primary); }
  .ver-pill.warn { background: var(--warning-soft); border-color: var(--warning); color: var(--gold-deep); }
  .ver-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
  .ver-pill.warn .dot { background: var(--warning); }

  /* === Toolbar (above table) === */
  .toolbar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; font-size: 12px; color: var(--text-soft);
    background: var(--panel); border: 1px solid var(--border); border-bottom: 0; border-radius: var(--r-md) var(--r-md) 0 0; margin-top: 12px; }
  .toolbar .grow { flex: 1; }
  .toolbar .density { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 4px; overflow: hidden; }
  .toolbar .density button { border: 0; background: #fff; padding: 3px 8px; color: var(--text-soft); font-size: 11px; border-right: 1px solid var(--border); }
  .toolbar .density button:last-child { border-right: 0; }
  .toolbar .density button.on { background: var(--primary); color: #fff; }
  .toolbar .tot { font-weight: 500; color: var(--text); }
  .toolbar .tot b { color: var(--primary-600); }

  /* === Table === */
  .tableshell { background: var(--panel); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 var(--r-md) var(--r-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .table-wrap { overflow: auto; max-height: 64vh; }
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.grid thead th { background: #f1f5fa; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    padding: 6px 10px; text-align: center; font-weight: 600; white-space: nowrap; user-select: none; color: var(--text);
    font-size: 12px; position: sticky; z-index: 3; }
  table.grid thead tr:nth-child(1) th { top: 0; }
  table.grid thead tr:nth-child(2) th { top: var(--th-h-1); }
  table.grid thead tr:nth-child(3) th { top: calc(var(--th-h-1) + var(--th-h-2)); }
  table.grid thead tr:nth-child(4) th { top: calc(var(--th-h-1) + var(--th-h-2) + var(--th-h-3)); }
  table.grid thead th.leaf { background: #e5edf7; border-bottom: 2px solid #c7d2fe; color: var(--text); }
  table.grid thead th.leaf.sorted { border-bottom-color: var(--primary); background: linear-gradient(180deg, #dbeafe 0%, #c7d8f5 100%); }
  table.grid thead th.leaf.filtered .funnel { color: var(--primary); }
  table.grid thead th.sortable { cursor: pointer; }
  table.grid thead th.sortable:hover { background: #dbeafe; }
  table.grid thead th .label-row { display: inline-flex; align-items: center; gap: 4px; }
  table.grid thead th .arr { color: var(--muted); font-size: 9px; transition: color .12s; }
  table.grid thead th.sorted .arr { color: var(--primary); }
  table.grid thead th .funnel { color: var(--muted); font-size: 10px; cursor: pointer; padding: 0 2px; border-radius: 3px; }
  table.grid thead th .funnel:hover { background: var(--primary-100); color: var(--primary); }
  table.grid thead th.pin-left,  table.grid tbody td.pin-left  { position: sticky; left: 0; background: inherit; z-index: 2; box-shadow: 1px 0 0 var(--border); }
  table.grid thead th.pin-left { z-index: 4; }
  table.grid thead th.pin-right, table.grid tbody td.pin-right { position: sticky; right: 0; background: inherit; z-index: 2; box-shadow: -1px 0 0 var(--border); }
  table.grid thead th.pin-right { z-index: 4; }
  table.grid tbody td { padding: 7px 10px; border-bottom: 1px solid #eef0f3; white-space: nowrap; vertical-align: middle; }
  table.grid tbody tr:nth-child(even) td { background: var(--row-stripe); }
  table.grid tbody tr.fav td { background: linear-gradient(90deg, rgba(254,243,199,.4) 0%, rgba(254,243,199,0) 100%); }
  table.grid tbody tr:hover td { background: var(--row-hover); }
  table.grid tbody tr.fav:hover td { background: linear-gradient(90deg, rgba(254,243,199,.55) 0%, var(--row-hover) 100%); }
  table.grid.density-compact tbody td { padding: 4px 10px; }
  table.grid.density-loose tbody td { padding: 11px 10px; }
  table.grid td.num { text-align: right; }
  table.grid td.empty { color: var(--muted); font-style: italic; text-align: center; }
  table.grid td.dim { font-weight: 500; }
  table.grid td.click { cursor: pointer; color: var(--primary-600); }
  table.grid td.click:hover { text-decoration: underline; background: var(--primary-50) !important; }

  /* Row star cell */
  .fav-th, .fav-td { width: 38px; padding: 0 !important; text-align: center !important; background: #f1f5fa !important; }
  table.grid tbody tr td.fav-td { background: #f8fafc; border-right: 1px solid var(--border); }
  table.grid tbody tr.fav td.fav-td { background: var(--gold-soft); }
  table.grid tbody tr:hover td.fav-td { background: var(--primary-50); }
  table.grid tbody tr.fav:hover td.fav-td { background: var(--gold-soft); }
  .star { font-size: 17px; line-height: 1; background: transparent; border: 0; padding: 4px; border-radius: 4px;
    color: #cbd5e1; transition: transform .12s, color .12s; }
  .star:hover { color: var(--gold); transform: scale(1.18); background: var(--gold-soft); }
  .star.on { color: var(--gold); text-shadow: 0 0 0 var(--gold-deep), 1px 0 0 var(--gold-deep), -1px 0 0 var(--gold-deep), 0 1px 0 var(--gold-deep), 0 -1px 0 var(--gold-deep); }
  .star.on:hover { color: var(--gold-deep); }

  /* Source badge in cell */
  .src-badge { display: inline-block; font-size: 9px; padding: 0 4px; border-radius: 3px; vertical-align: middle; margin-left: 4px; cursor: pointer; }
  .src-badge:hover { filter: brightness(1.05); }
  .src-crm { background: #fde2e2; color: #b91c1c; }
  .src-erp { background: #dbeafe; color: #1d4ed8; }
  .src-wms { background: #dcfce7; color: #166534; }
  .src-csv { background: #fef3c7; color: #92400e; }
  .src-compute { background: #ede9fe; color: #6d28d9; }

  /* Pagination */
  .pagination { display: flex; align-items: center; gap: 10px; padding: 8px 12px; color: var(--text-soft); font-size: 12px; border-top: 1px solid var(--border); background: #fbfcfe; }
  .pagination .spacer { flex: 1; }
  .pagination select { padding: 3px 6px; border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; }

  /* === Popup (dropdowns, filter pop, audit pop) === */
  .popup { position: fixed; background: #fff; border: 1px solid var(--border-strong); border-radius: var(--r-md);
    box-shadow: var(--shadow-lg); z-index: 100; min-width: 280px; max-width: 380px; }
  .popup-head { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .popup-head input.q { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 5px 9px; outline: 0; transition: all .12s; }
  .popup-head input.q:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-50); }
  .popup-head .row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-soft); flex-wrap: wrap; }
  .popup-head select { border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 4px; font: inherit; font-size: 11px; background: #fff; }
  .popup-body { max-height: 320px; overflow: auto; padding: 4px 0; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; border-radius: 4px; margin: 0 4px; }
  .opt:hover { background: var(--row-hover); }
  .opt.sel { background: var(--primary-50); color: var(--primary-600); font-weight: 500; }
  .opt .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .opt .meta { color: var(--muted); font-size: 11px; }
  .opt .caret { color: var(--muted); width: 14px; display: inline-block; text-align: center; }
  .opt .indent { display: inline-block; }
  .popup-foot { padding: 6px 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .popup-foot .more { color: var(--primary); cursor: pointer; }

  /* Column filter popup */
  .colfilter { padding: 10px 12px; min-width: 280px; }
  .colfilter h4 { margin: 0 0 8px; font-size: 12px; color: var(--text-soft); }
  .colfilter .ctl { display: flex; gap: 6px; margin-bottom: 8px; }
  .colfilter select, .colfilter input { padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 4px; outline: 0; }
  .colfilter input:focus, .colfilter select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-50); }
  .colfilter .btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }

  /* === Drawer === */
  .drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.32); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .drawer-mask.show { opacity: 1; pointer-events: all; }
  .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 400px; background: #fff;
    border-left: 1px solid var(--border-strong); box-shadow: -12px 0 32px rgba(15,23,42,.16); z-index: 201;
    transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.7,.2,1); display: flex; flex-direction: column; }
  .drawer.show { transform: translateX(0); }
  .drawer-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .drawer-head h2 { margin: 0; font-size: 15px; flex: 1; }
  .drawer-body { padding: 8px 0; overflow: auto; flex: 1; }
  .drawer-foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: #fbfcfe; }
  .drawer-foot label { margin-right: auto; font-size: 12px; color: var(--text-soft); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .col-group-head { display: flex; align-items: center; gap: 6px; padding: 6px 16px; color: var(--text-soft);
    font-size: 11px; font-weight: 600; user-select: none; cursor: pointer; text-transform: uppercase; letter-spacing: .04em; }
  .col-group-head.lvl-2 { padding-left: 28px; font-size: 11px; text-transform: none; letter-spacing: 0; color: var(--text-soft); }
  .col-group-head.lvl-3 { padding-left: 40px; font-size: 11px; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .col-group-head .ct { margin-left: auto; font-weight: 500; color: var(--muted); }
  .col-row { display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 28px; border-radius: 4px; margin: 0 6px; }
  .col-row.lvl-2 { padding-left: 40px; }
  .col-row.lvl-3 { padding-left: 52px; }
  .col-row:hover { background: var(--row-hover); }
  .col-row input[type=checkbox] { accent-color: var(--primary); }
  .col-row .lbl { flex: 1; }
  .col-row .lbl.dim { color: var(--muted); }
  .col-row .pin { font-size: 12px; color: var(--muted); cursor: pointer; padding: 2px 5px; border-radius: 4px; }
  .col-row .pin.on { color: var(--primary); background: var(--primary-50); }
  .col-row .pin:hover { color: var(--primary); }
  .col-row .ord-btns { display: flex; flex-direction: column; gap: 0; }
  .col-row .ord-btns button { border: 0; background: transparent; padding: 0 3px; color: var(--muted); cursor: pointer; line-height: 1; font-size: 10px; }
  .col-row .ord-btns button:hover { color: var(--primary); }
  .col-row .tag { font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--primary-100); color: var(--primary-600); }

  /* === Modal (drilldown) === */
  .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 300; display: none; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: var(--r-lg); box-shadow: var(--shadow-lg); max-width: 1100px; width: 90%;
    max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%); }
  .modal-head h2 { margin: 0; font-size: 15px; flex: 1; }
  .modal-head .sub { color: var(--muted); font-size: 12px; }
  .modal-body { padding: 12px 18px; overflow: auto; flex: 1; }
  .modal-body .modal-table-wrap { max-height: 56vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
  .modal-foot { padding: 10px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; color: var(--text-soft); font-size: 12px; background: #fbfcfe; }

  /* Audit popup */
  .audit-pop { position: fixed; background: #fff; border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow-lg);
    z-index: 320; min-width: 340px; padding: 12px 14px; font-size: 12px; }
  .audit-pop h4 { margin: 0 0 8px; font-size: 13px; }
  .audit-pop ul { margin: 0; padding: 0; list-style: none; }
  .audit-pop li { display: flex; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--border); }
  .audit-pop li:last-child { border: 0; }
  .audit-pop .spacer { flex: 1; }
  .audit-pop .ok  { color: var(--success); font-weight: 600; }
  .audit-pop .bad { color: var(--danger); font-weight: 600; text-decoration: line-through; }
  .audit-pop .ver { font-variant-numeric: tabular-nums; color: var(--text-soft); }

  /* === Misc === */
  .kbd { background: #f1f5fa; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
    padding: 0 5px; font-family: ui-monospace,SFMono-Regular,Consolas,monospace; font-size: 11px; color: var(--text-soft); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0f172a; color: #fff;
    padding: 8px 14px; border-radius: var(--r-md); z-index: 500; box-shadow: var(--shadow-lg); font-size: 12px;
    opacity: 0; pointer-events: none; transition: all .25s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .audit-mini-help { color: var(--muted); font-size: 11px; }
  .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }

  /* Tree-row dimension */
  td.tree-cell .tree-indent { display: inline-block; }
  td.tree-cell .tree-caret { display: inline-block; width: 14px; text-align: center; cursor: pointer; color: var(--muted); margin-right: 2px; user-select: none; }
  td.tree-cell .tree-caret:hover { color: var(--primary); }
  td.tree-cell .tree-caret.leaf { cursor: default; color: transparent; }
  tr.agg-d0 td { background: #eef2f7 !important; font-weight: 700; }
  tr.agg-d1 td { background: #f3f6fb !important; font-weight: 600; }
  tr.agg-d2 td { background: #f8fafc !important; font-weight: 500; }
  tr.agg-d0 td .src-badge, tr.agg-d1 td .src-badge, tr.agg-d2 td .src-badge { display:none; }

  /* KPI banner (看板模板) */
  .kpi-banner { display: flex; gap: 0; padding: 0; margin-top: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-sm); overflow: hidden; }
  .kpi-card { flex: 1; padding: 10px 16px; border-right: 1px solid var(--border); position: relative; }
  .kpi-card:last-child { border-right: 0; }
  .kpi-card .kpi-label { font-size: 11px; color: var(--text-soft); }
  .kpi-card .kpi-value { font-size: 22px; font-weight: 600; color: var(--text); margin-top: 2px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi-card .kpi-trend { font-size: 11px; margin-top: 2px; }
  .kpi-card .kpi-trend.up { color: var(--success); }
  .kpi-card .kpi-trend.down { color: var(--danger); }
  .kpi-card .kpi-spark { position: absolute; right: 12px; top: 12px; opacity: .35; font-size: 11px; }

  /* Mode select */
  .mode-sel { padding: 3px 8px; border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; font-size: 11px; color: var(--text-soft); }
  .mode-sel:focus { border-color: var(--primary); outline: 0; box-shadow: 0 0 0 3px var(--primary-50); }

  /* Distinct-values mode in column filter */
  .colfilter { min-width: 320px; }
  .colfilter .mode-tabs { display: flex; border-bottom: 1px solid var(--border); margin: -2px -4px 8px; padding: 0 4px; gap: 2px; }

function genFactRows(versionAdj) {
  const regions=["CN-31","CN-3205","CN-44","CN-11"];
  const labels={"CN-31":"上海","CN-3205":"苏州","CN-44":"广东","CN-11":"北京"};
  const prods=["P001","P002","P003","P004","P005","P006","P007","P008"];
  const rows=[];
  for (const r of regions) for (const p of prods) {
    const seed = (r+p).split("").reduce((a,c)=>a+c.charCodeAt(0),0) + versionAdj*97;
    const rand = (n) => ((seed * (n+1)) % 9973) / 9973;
    const gmv_app = Math.round(1200 + rand(1)*12000);
    const gmv_web = Math.round(700  + rand(2)*9000);
    const gmv_mp  = Math.round(300  + rand(3)*5500);
    const gmv_store = Math.round(900 + rand(4)*8000);
    const orders = Math.floor(20 + rand(5)*120);
    rows.push({
      region_code: r, region_label: labels[r], product_code: p,
      gmv_app, gmv_web, gmv_mp, gmv_store, orders,
      conv_rate: +(1 + rand(6)*5).toFixed(2),
      refund: Math.round(rand(7)*1200),
      stock: Math.floor(60 + rand(8)*440),
      safe_days: +(2 + rand(9)*15).toFixed(1),
      _row_key: { region_code:r, product_code:p },
      _audit: {
        gmv_app:   [SRC("crm",3), {source:"erp",vno:2,valid:false}],
        gmv_web:   [SRC("crm",3)],
        gmv_mp:    [SRC("crm",3)],
        gmv_store: [SRC("erp",2)],
        orders:    [SRC("erp",2)],
        refund:    [SRC("erp",2)],
        stock:     [SRC("wms",1)],
        safe_days: [SRC("compute",1)]
      }
    });
  }
  return rows;
}

    if (params.__method === "DELETE") { USER_PREFS[params.view] = []; return {ok:true}; }
    return { view: params.view, items: USER_PREFS[params.view] ?? [] };

function paged(items, p, defaultSize) {
  // paging=none 或缺失 page 参数 → 返全量（后端默认行为，前端可选自切片）
  if (p.paging === "none" || (p.page == null && p.page_size == null)) {
    return { items, page:1, page_size: items.length, total: items.length, has_more: false, paging: "none" };
  }
  const ps = +p.page_size || defaultSize, pg = +p.page || 1;
  return { items: items.slice((pg-1)*ps, pg*ps), page:pg, page_size:ps, total:items.length, has_more: pg*ps<items.length };
}
function sortBy(items, sortStr, defaultFields) {
  if (!sortStr && !defaultFields) return items;
  const sorters = (sortStr ? sortStr.split(",") : defaultFields.map(f => f+":asc")).map(s => s.split(":"));
  return items.sort((a,b) => {
    for (const [f,d] of sorters) {
      const av = f==="is_favorite" ? (a.is_favorite?1:0) : (a[f] ?? a.label ?? "");
      const bv = f==="is_favorite" ? (b.is_favorite?1:0) : (b[f] ?? b.label ?? "");
      if (av<bv) return d==="asc"?-1:1;
      if (av>bv) return d==="asc"?1:-1;
    } return 0;
  });
}
function sortRows(rows, sortStr) {
  if (!sortStr) return rows;
  const sorters = sortStr.split(",").map(s => s.split(":"));
  return rows.sort((a,b) => {
    for (const [f,d] of sorters) {
      const av = f === "_row_favorite" ? (a._row_favorite?1:0) : a[f];
      const bv = f === "_row_favorite" ? (b._row_favorite?1:0) : b[f];
      if (av<bv) return d==="asc"?-1:1;
      if (av>bv) return d==="asc"?1:-1;
    } return 0;
  });
}
function applyPredicate(v, op, val) {
  switch (op) {
    case "eq":  return v == val;
    case "ne":  return v != val;
    case "gt":  return Number(v) >  Number(val);
    case "gte": return Number(v) >= Number(val);
    case "lt":  return Number(v) <  Number(val);
    case "lte": return Number(v) <= Number(val);
    case "in":  return Array.isArray(val) ? val.includes(v) : false;
    case "ilike": return String(v ?? "").toLowerCase().includes(String(val ?? "").toLowerCase());
    case "between": return Number(v) >= Number(val[0]) && Number(v) <= Number(val[1]);
    default: return true;
  }
}

/* ════════════════════════════════════════════════════════════════════
   Pure functions (header tree)
   ════════════════════════════════════════════════════════════════════ */
function isLeaf(n) { return !n.children; }
function mergeColumns(tree, prefs) {
  const pmap = new Map((prefs ?? []).map(p => [p.field_code, p]));
  function walk(n) {
    if (isLeaf(n)) {
      const p = pmap.get(n.code);
      return { ...n, kind:"leaf",
        _visible: p?.is_visible ?? n.is_default_visible,
        _order:   p?.order_idx  ?? n.default_order,
        _width:   p?.width      ?? n.default_width,
        _pinned:  p?.pinned     ?? n.default_pinned ?? "none" };
    }
    const kids = n.children.map(walk);
    // 排序：叶子按 _order，分组保持原顺序
    kids.sort((a,b) => {
      if (a.kind==="leaf" && b.kind==="leaf") return a._order - b._order;
      return 0;
    });
    return { ...n, kind:"group", children: kids };
  }
  return tree.map(walk);
}
function treeMaxDepth(n) {
  if (n.kind === "leaf") return 1;
  return 1 + Math.max(...n.children.map(treeMaxDepth));
}
function visibleLeaves(n) {
  if (n.kind === "leaf") return n._visible ? [n] : [];
  return n.children.flatMap(visibleLeaves);
}
function buildHeaderMatrix(tree) {
  const maxDepth = Math.max(...tree.map(treeMaxDepth));
  const rows = Array.from({length: maxDepth}, () => []);
  function walk(n, depth) {
    if (n.kind === "leaf") {
      if (!n._visible) return;
      rows[depth].push({ kind:"leaf", node:n, rowSpan: maxDepth - depth });
      return;
    }
    const span = n.children.flatMap(visibleLeaves).length;
    if (span === 0) return;
    rows[depth].push({ kind:"group", node:n, colSpan: span });
    n.children.forEach(c => walk(c, depth+1));
  }
  tree.forEach(n => walk(n, 0));
  return { rows, maxDepth };
}

/* ════════════════════════════════════════════════════════════════════
   Tree builder (维度列树状)
   ════════════════════════════════════════════════════════════════════ */
const REGION_META = {
  "CN-31":   { city:"上海", area:"华东", areaCode:"CN-EAST" },
  "CN-3205": { city:"苏州", area:"华东", areaCode:"CN-EAST" },
  "CN-44":   { city:"广东", area:"华南", areaCode:"CN-SOUTH" },
  "CN-11":   { city:"北京", area:"华北", areaCode:"CN-NORTH" }
};
const TREE_SUMS = ["gmv_app","gmv_web","gmv_mp","gmv_store","orders","refund","stock"];
function aggregateRow(label, rows, depth, key, parent, dimCols) {
  const o = { _treeLabel: label, _depth: depth, _treeKey: key, _treeParent: parent, _has_children: true, _is_agg: true };
  TREE_SUMS.forEach(k => o[k] = rows.reduce((s,r) => s + (+r[k]||0), 0));
  o.conv_rate = rows.length ? rows.reduce((s,r) => s + (+r.conv_rate||0), 0) / rows.length : 0;
  o.safe_days = rows.length ? rows.reduce((s,r) => s + (+r.safe_days||0), 0) / rows.length : 0;
  return o;
}
function buildTreeFromRows(flat) {
  const out = [];
  if (!flat.length) return out;
  out.push(aggregateRow("全国 (聚合)", flat, 0, "__root__", null));
  const areas = {};
  flat.forEach(r => {
    const m = REGION_META[r.region_code]; if (!m) return;
    (areas[m.areaCode] = areas[m.areaCode] || { meta:m, rows:[] }).rows.push(r);
  });
  for (const ac of Object.keys(areas)) {
    out.push(aggregateRow(areas[ac].meta.area, areas[ac].rows, 1, ac, "__root__"));
    const cities = {};
    areas[ac].rows.forEach(r => {
      (cities[r.region_code] = cities[r.region_code] || { rows:[] }).rows.push(r);
    });
    for (const cc of Object.keys(cities)) {
      const m = REGION_META[cc];
      out.push(aggregateRow(`${m.city} (${cc})`, cities[cc].rows, 2, cc, ac));
      cities[cc].rows.forEach(r => {
        out.push({ ...r, _depth:3, _treeKey: cc+"|"+r.product_code, _treeParent: cc, _has_children:false, _is_agg:false, _treeLabel: r.product_code });
      });
    }
  }
  return out;
}
function visibleTreeRows(tree) {
  // 仅显示祖先全部已展开的行
  const expanded = state.expandedTreeKeys;
  const map = new Map(tree.map(r => [r._treeKey, r]));
  return tree.filter(r => {
    let cur = r._treeParent;
    while (cur != null) {
      if (!expanded.has(cur)) return false;
      cur = map.get(cur)?._treeParent ?? null;
    }
    return true;
  });
}

      };
      fI.onchange = update; tI.onchange = update;
      inp.append(fL, fI, tL, tI);
      if (f.unit) { const u = document.createElement("span"); u.textContent = f.unit; u.style.color="var(--muted)"; u.style.fontSize="11px"; inp.appendChild(u); }
      wrap.appendChild(inp);
    } else if (f.kind === "boolean") {
      const inp = document.createElement("div"); inp.className = "field-input"; inp.style.minWidth = "auto";
      const lab = document.createElement("label"); lab.style.display="inline-flex"; lab.style.alignItems="center"; lab.style.gap="6px"; lab.style.cursor="pointer";
      const cb = document.createElement("input"); cb.type="checkbox";
      cb.checked = !!state.filterValues[f.code]?.value;
      cb.onchange = () => state.filterValues[f.code] = { value: cb.checked };
      lab.append(cb, document.createTextNode(cb.checked ? (f.true_label||"是") : (f.false_label||"否")));
      cb.onchange = () => { state.filterValues[f.code] = { value: cb.checked }; renderFilterBar(); };
      inp.appendChild(lab);
      wrap.appendChild(inp);
    }
    bar.appendChild(wrap);
  }
  const acts = document.createElement("div"); acts.className = "actions";
  const reset = document.createElement("button"); reset.className="btn ghost"; reset.textContent="重置";
  reset.onclick = () => {
    state.filterValues = {}; state.rowFilters = [];
    for (const f of state.config.filters) if (f.default) state.filterValues[f.code] = {...f.default};
    state.page = 1; renderFilterBar(); refresh();
  };
  const query = document.createElement("button"); query.className="btn primary"; query.textContent="查询";
  query.onclick = () => { state.page = 1; refresh(); };
  acts.append(reset, query);
  bar.appendChild(acts);
}
function buildDropdownInput(filter, kind) {
  const inp = document.createElement("div"); inp.className = "field-input";
  const val = state.filterValues[filter.code];
  const render = () => {
    inp.innerHTML = "";
    if (val) {
      const chip = document.createElement("span"); chip.className="chip";
      chip.innerHTML = `${val.label || val} <span class="x" title="清除">×</span>`;

      inp.appendChild(chip);

      const ph = document.createElement("span"); ph.style.color = "var(--muted)"; ph.textContent = "选择 "+filter.label+" …";

}

function buildMultiSelectInput(filter) {
  const inp = document.createElement("div"); inp.className = "field-input";
  inp.style.minWidth = "260px"; inp.style.flexWrap = "wrap";
  const arr = (state.filterValues[filter.code] || []);
  if (arr.length === 0) {
    const ph = document.createElement("span"); ph.style.color = "var(--muted)";
    ph.textContent = "选择多个 " + filter.label + " …";
    inp.appendChild(ph);
  } else {
    arr.slice(0, 4).forEach(v => {
      const chip = document.createElement("span"); chip.className="chip";
      chip.innerHTML = `${v.label || v.value} <span class="x" title="移除">×</span>`;
      chip.querySelector(".x").onclick = e => {
        e.stopPropagation();
        state.filterValues[filter.code] = (state.filterValues[filter.code] || []).filter(x => (x.value||x) !== (v.value||v));
        renderFilterBar();
      };
      inp.appendChild(chip);
    });
    if (arr.length > 4) {
      const m = document.createElement("span"); m.className="chip"; m.style.background="#e5e7eb"; m.style.color="var(--text-soft)";
      m.textContent = `+${arr.length - 4}`; inp.appendChild(m);
    }
  }
  const car = document.createElement("span"); car.textContent=" ▾"; car.style.color="var(--muted)"; car.style.marginLeft = "auto";
  inp.appendChild(car);
  inp.onclick = (e) => openMultiSelectPopup(filter, e.currentTarget);

}

function openMultiSelectPopup(filter, anchor) {
  closePopup();
  const rect = anchor.getBoundingClientRect();
  popupEl = document.createElement("div"); popupEl.className = "popup";
  popupEl.style.left = rect.left + "px"; popupEl.style.top = (rect.bottom + 4) + "px";
  popupEl.style.minWidth = Math.max(320, rect.width) + "px";
  const src = filter.source;
  const stateP = {
    q:"", sort:(src.default_sort ?? []).map(s=>`${s.field}:${s.dir}`).join(","),
    only_favorites:false, expanded:{}, page:1
  };
  const max_picks = src.max_picks ?? 0;
  const selected = () => state.filterValues[filter.code] || [];
  const isSelected = (v) => selected().some(x => (x.value||x) === v);

  const head = document.createElement("div"); head.className = "popup-head";
  const qIn = document.createElement("input"); qIn.className="q"; qIn.placeholder = "搜索 " + filter.label + " …";
  head.appendChild(qIn);
  const row = document.createElement("div"); row.className="row";
  if (src.supports_favorite) {
    const lab = document.createElement("label"); lab.style.cursor="pointer"; lab.style.display="inline-flex"; lab.style.alignItems="center"; lab.style.gap="4px";
    const cb = document.createElement("input"); cb.type="checkbox";
    cb.onchange = () => { stateP.only_favorites = cb.checked; load(); };
    lab.append(cb, document.createTextNode("只看 ★"));
    row.appendChild(lab);
  }
  const sel = document.createElement("span"); sel.style.marginLeft="auto";
  sel.innerHTML = `已选 <b style="color:var(--primary);">${selected().length}</b>${max_picks?` / ${max_picks}`:""}`;
  row.appendChild(sel);
  head.appendChild(row);
  popupEl.appendChild(head);

  const body = document.createElement("div"); body.className = "popup-body"; popupEl.appendChild(body);

  const foot = document.createElement("div"); foot.className = "popup-foot";
  foot.innerHTML = `<button class="btn sm ghost" id="msClear">清空</button><span style="flex:1;"></span><button class="btn sm primary" id="msDone">完成</button>`;
  popupEl.appendChild(foot);
  document.body.appendChild(popupEl);
  qIn.focus();

  popupEl.querySelector("#msDone").onclick = () => { closePopup(); renderFilterBar(); };
  popupEl.querySelector("#msClear").onclick = () => { state.filterValues[filter.code] = []; load(); sel.innerHTML = `已选 <b style="color:var(--primary);">0</b>${max_picks?` / ${max_picks}`:""}`; };

  let timer;
  qIn.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { stateP.q = qIn.value; stateP.page = 1; stateP.expanded = {}; load(); }, 200); };

  async function load() {
    body.innerHTML = `<div style="padding:16px;color:var(--muted);">加载中…</div>`;
    const tree = await loadTree(filter, stateP);
    body.innerHTML = "";
    for (const node of tree) {
      const r = renderMultiOpt(filter, node, stateP, load, isSelected, sel, max_picks);
      body.appendChild(r);
    }
  }
  load();
}

function renderMultiOpt(filter, node, stateP, reload, isSelected, selChip, max_picks) {
  const row = document.createElement("div"); row.className = "opt";
  const max = filter.source.max_levels || 99;
  const isMaxLeaf = node.depth >= max - 1;
  const canSelect = !node.has_children || isMaxLeaf || filter.source.select_at_any_depth;
  const canExpand = node.has_children && !isMaxLeaf;
  if (isSelected(node.value)) row.classList.add("sel");
  const indent = document.createElement("span"); indent.className="indent"; indent.style.width=(node.depth*14)+"px";
  row.appendChild(indent);
  const caret = document.createElement("span"); caret.className="caret";
  caret.textContent = canExpand ? (stateP.expanded[node.value] ? "▾" : "▸") : " ";
  if (canExpand) {
    caret.style.cursor = "pointer";
    caret.onclick = (e) => { e.stopPropagation(); stateP.expanded[node.value] = !stateP.expanded[node.value]; reload(); };
  }
  row.appendChild(caret);
  // 多选 checkbox
  const cb = document.createElement("input"); cb.type="checkbox"; cb.style.accentColor = "var(--primary)";
  cb.checked = isSelected(node.value); cb.disabled = !canSelect;
  cb.onclick = (e) => {
    e.stopPropagation();
    const arr = state.filterValues[filter.code] || [];
    if (cb.checked) {
      if (max_picks && arr.length >= max_picks) { cb.checked = false; toast(`最多 ${max_picks} 个`); return; }
      arr.push({ value: node.value, label: node.label });
    } else {
      const idx = arr.findIndex(x => (x.value||x) === node.value);
      if (idx >= 0) arr.splice(idx, 1);
    }
    state.filterValues[filter.code] = arr;
    selChip.innerHTML = `已选 <b style="color:var(--primary);">${arr.length}</b>${max_picks?` / ${max_picks}`:""}`;
    row.classList.toggle("sel", cb.checked);
  };
  row.appendChild(cb);
  const lbl = document.createElement("span"); lbl.className="lbl"; lbl.textContent = node.label;
  if (!canSelect) lbl.style.color = "var(--muted)";
  row.appendChild(lbl);
  if (node.usage_count != null) {
    const m = document.createElement("span"); m.className="meta"; m.textContent = "用量 "+node.usage_count;
    row.appendChild(m);
  }
  if (filter.source.supports_favorite) row.appendChild(starBtn(node, "region_tree"));
  row.onclick = (e) => {
    if (e.target.closest(".caret") || e.target.closest(".star") || e.target.tagName === "INPUT") return;
    if (canSelect) { cb.checked = !cb.checked; cb.click(); }
  };
  return row;
}

/* ───── Table ───── */
function renderTable() {
  const tree0 = state.config.columns.summary.header_tree;
  state.tree = mergeColumns(tree0, USER_PREFS.summary);
  state.leaves = state.tree.flatMap(visibleLeaves);
  const { rows, maxDepth } = buildHeaderMatrix(state.tree);

  // 设置 CSS variable for sticky tops
  document.documentElement.style.setProperty("--th-h-1", "32px");
  document.documentElement.style.setProperty("--th-h-2", "30px");
  document.documentElement.style.setProperty("--th-h-3", "30px");
  document.documentElement.style.setProperty("--th-h-4", "30px");

  const table = document.getElementById("table");
  table.className = "grid density-" + state.density;
  table.innerHTML = "";

  // <thead>
  const thead = document.createElement("thead");
  // Each header row
  for (let i=0; i<maxDepth; i++) {
    const tr = document.createElement("tr");
    // row-favorite cell: only on the bottom row (leaf row)
    if (i === 0 && state.config.primary_view.row_favorite?.enabled) {
      const th = document.createElement("th");
      th.className = "fav-th"; th.rowSpan = maxDepth;
      th.style.position = "sticky"; th.style.left = "0"; th.style.zIndex = "5";
      th.innerHTML = "★";
      tr.appendChild(th);
    }
    for (const cell of rows[i]) {
      const th = document.createElement("th");
      if (cell.kind === "leaf") {
        th.classList.add("leaf");
        if (cell.rowSpan > 1) th.rowSpan = cell.rowSpan;
        if (cell.node._pinned === "left") th.classList.add("pin-left");
        if (cell.node._pinned === "right") th.classList.add("pin-right");
        if (cell.node.sortable) th.classList.add("sortable");
        if (cell.node.code && state.sort?.field === cell.node.code) th.classList.add("sorted");
        if (state.rowFilters.some(f => f.column === cell.node.code)) th.classList.add("filtered");
        const lbl = document.createElement("span"); lbl.className="label-row";
        lbl.appendChild(document.createTextNode(cell.node.label));
        if (cell.node.sortable) {
          const arr = document.createElement("span"); arr.className="arr";
          arr.textContent = state.sort?.field === cell.node.code ? (state.sort.dir==="asc"?"▲":"▼") : "↕";
          lbl.appendChild(arr);
        }
        if (cell.node.row_filterable) {
          const f = document.createElement("span"); f.className="funnel"; f.textContent="▽"; f.title="按列筛选";
          f.onclick = (e) => { e.stopPropagation(); openColumnFilter(cell.node, e.currentTarget); };
          lbl.appendChild(f);
        }
        th.appendChild(lbl);
        if (cell.node.sortable) th.onclick = () => toggleSort(cell.node.code);
      } else {
        th.colSpan = cell.colSpan;
        th.textContent = cell.node.label;
        th.style.background = "#e9eef7";
      }
      tr.appendChild(th);
    }
    thead.appendChild(tr);
  }
  table.appendChild(thead);

  // <tbody> —— 树状模式时把 state.allRows 转成树，过滤可见行
  const tbody = document.createElement("tbody");
  const isTree = state.treeMode;
  let renderRows = state.rows;
  if (isTree) {
    const source = state.allRows.length ? state.allRows : state.rows;
    renderRows = visibleTreeRows(buildTreeFromRows(source));
  }
  // 第一列 dimension code（用于附 tree-cell 控件）
  const firstDimCode = state.leaves.find(c => c.code === "region_code")?.code || state.leaves[0]?.code;
  for (const r of renderRows) {
    const trr = document.createElement("tr");
    if (r._row_favorite) trr.classList.add("fav");
    if (isTree && r._is_agg) trr.classList.add("agg-d" + r._depth);
    // star cell（聚合行不渲染收藏按钮）
    if (state.config.primary_view.row_favorite?.enabled) {
      const td = document.createElement("td"); td.className = "fav-td";
      if (!isTree || !r._is_agg) {
        const btn = document.createElement("button"); btn.className = "star" + (r._row_favorite ? " on" : "");
        btn.textContent = r._row_favorite ? "★" : "☆";
        btn.title = r._row_favorite ? "取消收藏" : "收藏此行（置顶）";
        btn.onclick = async (e) => {
          e.stopPropagation();
          const next = !r._row_favorite;
          await api(`/api/users/me/row_favorites/daily_sales`, {
            business_date: state.filterValues.business_date?.from,
            business_key: { region_code: r.region_code, product_code: r.product_code },
            favorited: next
          });
          r._row_favorite = next;
          toast(next ? "已收藏 " + r.region_label + "/" + r.product_code : "取消收藏");
          refresh();
        };
        td.appendChild(btn);
      }
      trr.appendChild(td);
    }
    for (const c of state.leaves) {
      const td = document.createElement("td");
      let val = r[c.code];
      let isTreeCell = false;
      if (isTree && c.code === firstDimCode) {
        // 第一维度列：渲染缩进 + caret + 标签
        isTreeCell = true;
        td.className = "tree-cell" + (c._pinned==="left"?" pin-left":"");
        td.classList.add("dim");
        const indent = document.createElement("span");
        indent.className = "tree-indent";
        indent.style.width = ((r._depth ?? 0) * 16) + "px";
        td.appendChild(indent);
        const caret = document.createElement("span");
        caret.className = "tree-caret" + (r._has_children ? "" : " leaf");
        const isExpanded = state.expandedTreeKeys.has(r._treeKey);
        caret.textContent = r._has_children ? (isExpanded ? "▾" : "▸") : "·";
        if (r._has_children) {
          caret.onclick = () => {
            if (isExpanded) state.expandedTreeKeys.delete(r._treeKey);
            else state.expandedTreeKeys.add(r._treeKey);
            renderTable();
          };
        }
        td.appendChild(caret);
        const lab = document.createElement("span");
        lab.textContent = r._treeLabel || (r.region_label ? `${r.region_label} (${r.region_code})` : r[c.code]);
        if (r._is_agg) lab.style.fontWeight = "600";
        td.appendChild(lab);
      } else {
        if (c.code === "region_code" && r.region_label) val = `${r.region_label} (${val})`;
        const fm = formatCell(val, c.display);
        td.className = fm.cls + (c._pinned==="left"?" pin-left":"") + (c._pinned==="right"?" pin-right":"");
        if (c.code === "region_code" || c.code === "product_code") td.classList.add("dim");
        td.textContent = fm.text;
      }
      // drilldown：聚合行禁用
      if (c.drilldown && val != null && val !== "" && !(isTree && r._is_agg) && !isTreeCell) {
        td.classList.add("click");
        td.onclick = () => openDrilldown(c, r);
      }
      // audit badge：仅叶子行
      if (r._audit && r._audit[c.code] && !(isTree && r._is_agg)) {
        const v = r._audit[c.code].find(x => x.valid);
        if (v) {
          const b = document.createElement("span");
          b.className = "src-badge src-" + v.source;
          b.textContent = v.source + " v" + v.vno;
          b.title = "点击查看溯源";
          b.onclick = (e) => { e.stopPropagation(); showAudit(r, c, e); };
          td.appendChild(document.createTextNode(" "));
          td.appendChild(b);
        }
      }
      trr.appendChild(td);
    }
    tbody.appendChild(trr);
  }
  table.appendChild(tbody);

  // toolbar / pagination
  const pmTag = ({server:"服务端分页", client:"客户端分页 (全量已拉)", none:"不分页 (全量)"})[state.pagingMode];
  let metaText = `${state.total} 行 · 当前 ${state.rows.length} 行 · <span style="color:var(--primary);">${pmTag}</span>`;
  if (state.treeMode) metaText += ` · <span style="color:var(--success);">🌲 树状模式</span>`;
  if (state.totals && state.totals.gmv_app != null) metaText += ` · <b>APP GMV合计</b> ¥${state.totals.gmv_app.toLocaleString("zh-CN",{maximumFractionDigits:0})}`;
  if (state.rowFilters.length) metaText += ` · <span style="color:var(--primary);">${state.rowFilters.length} 个列筛选</span>`;
  document.getElementById("rowMeta").innerHTML = metaText;
  renderPagination();

  // Now measure actual th heights and set CSS variables (for sticky to be exact)
  measureHeaderHeights();
}
function measureHeaderHeights() {
  const trs = document.querySelectorAll("#table thead tr");
  trs.forEach((tr, i) => {
    document.documentElement.style.setProperty(`--th-h-${i+1}`, tr.offsetHeight + "px");
  });
}
function formatCell(v, disp) {
  if (v == null || v === "") return {text:"—", cls:"empty"};
  if (!disp || disp.kind === "text") return {text: String(v), cls:""};
  if (disp.kind === "number") {
    const n = Number(v);
    if (Number.isNaN(n)) return {text:String(v), cls:""};
    const s = n.toLocaleString("zh-CN", {minimumFractionDigits: disp.precision ?? 0, maximumFractionDigits: disp.precision ?? 0});
    return {text: (disp.unit ?? "") + s, cls:"num"};
  }
  if (disp.kind === "percent") return {text: Number(v).toFixed(disp.precision ?? 1) + "%", cls:"num"};
  return {text:String(v), cls:""};
}
function toggleSort(field) {
  if (state.sort?.field === field) {
    if (state.sort.dir === "asc") state.sort.dir = "desc";
    else state.sort = null;
  } else state.sort = { field, dir: "asc" };
  refresh();
}
function renderPagination() {
  const el = document.getElementById("pagination");
  const totalPages = Math.max(1, Math.ceil(state.total / state.page_size));
  el.innerHTML = "";
  const psSel = document.createElement("select");
  for (const s of [20,50,100,200]) {
    const o = document.createElement("option"); o.value=s; o.textContent=s+" 行/页";
    if (s===state.page_size) o.selected = true; psSel.appendChild(o);
  }
  psSel.onchange = () => { state.page_size = +psSel.value; state.page = 1; refresh(); };
  const prev = document.createElement("button"); prev.className="btn sm"; prev.textContent="‹ 上一页"; prev.disabled = state.page<=1;
  prev.onclick = () => { state.page--; refresh(); };
  const next = document.createElement("button"); next.className="btn sm"; next.textContent="下一页 ›"; next.disabled = state.page>=totalPages;
  next.onclick = () => { state.page++; refresh(); };
  const info = document.createElement("span"); info.textContent = `第 ${state.page} / ${totalPages} 页`;
  const spacer = document.createElement("span"); spacer.className = "spacer";
  el.append(psSel, spacer, prev, info, next);
}

async function openColumnFilter(col, anchor) {

    } else {
      body.innerHTML = `
        <div style="color:var(--muted);font-size:11px;margin-bottom:6px;">显示该列<b>去重后</b>的可选值（带出现次数）。多选 = SQL <code>IN (…)</code> 谓词。</div>
        <input class="distinct-search" placeholder="搜索值…" id="dvSearch" />
        <div class="pick-all"><a id="dvAll">全选</a><a id="dvNone">全不选</a><a id="dvInvert">反选</a><span style="margin-left:auto;color:var(--muted);" id="dvCount"></span></div>
        <div class="distinct-list" id="dvList"><div style="padding:8px;color:var(--muted);">加载中…</div></div>`;
      api(`/api/reports/daily_sales/distinct`, { column: col.code }).then(r => {
        const list = popupEl.querySelector("#dvList");
        const renderList = (filter="") => {
          list.innerHTML = "";

          for (const it of items) {
            const lab = document.createElement("label");
            const cb = document.createElement("input"); cb.type="checkbox";
            cb.checked = pickedValues.includes(it.value);
            cb.onchange = () => {
              if (cb.checked && !pickedValues.includes(it.value)) pickedValues.push(it.value);
              if (!cb.checked) pickedValues = pickedValues.filter(v => v !== it.value);
              popupEl.querySelector("#dvCount").textContent = `已选 ${pickedValues.length} / ${r.items.length}`;
            };
            const txt = document.createElement("span"); txt.textContent = it.label;

            lab.append(cb, txt, ct); list.appendChild(lab);

        popupEl.querySelector("#dvNone").onclick   = () => { pickedValues = []; renderList(popupEl.querySelector("#dvSearch").value); };
        popupEl.querySelector("#dvInvert").onclick = () => { const all = r.items.map(x => x.value); pickedValues = all.filter(v => !pickedValues.includes(v)); renderList(popupEl.querySelector("#dvSearch").value); };

  popupEl.querySelectorAll(".mode-tab").forEach(t => {

      if (pickedValues.length) {
        state.rowFilters.push({column: col.code, op: "in", value: pickedValues});

    }
    closePopup(); state.page = 1; refresh();
  };
  popupEl.querySelector("#cfClear").onclick = () => {
    state.rowFilters = state.rowFilters.filter(f => f.column !== col.code);
    closePopup(); state.page = 1; refresh();
  };

/* ════════════════════════════════════════════════════════════════════
   Dropdown popup (hierarchy + search)
   ════════════════════════════════════════════════════════════════════ */
function openDropdownPopup(filter, kind, anchor) {
  closePopup();
  const rect = anchor.getBoundingClientRect();
  popupEl = document.createElement("div"); popupEl.className = "popup";
  popupEl.style.left = rect.left + "px"; popupEl.style.top = (rect.bottom + 4) + "px";
  popupEl.style.minWidth = Math.max(280, rect.width) + "px";
  const src = filter.source;
  const stateP = {
    q:"", sort:(src.default_sort ?? []).map(s=>`${s.field}:${s.dir}`).join(","),
    only_favorites:false, expanded:{}, page:1
  };
  const head = document.createElement("div"); head.className="popup-head";
  const qIn = document.createElement("input"); qIn.className="q";
  qIn.placeholder = kind==="search" ? "搜索产品（名称/编码）…" : "搜索区域 / 输入关键字…";
  head.appendChild(qIn);
  if (src.supports_favorite || src.sortable_by?.length) {
    const row = document.createElement("div"); row.className="row";
    if (src.supports_favorite) {
      const lab = document.createElement("label");
      lab.style.display="inline-flex"; lab.style.alignItems="center"; lab.style.gap="4px"; lab.style.cursor="pointer";
      const cb = document.createElement("input"); cb.type="checkbox";
      cb.onchange = () => { stateP.only_favorites = cb.checked; load(); };
      lab.append(cb, document.createTextNode("只看 ★"));
      row.appendChild(lab);
    }
    if (src.sortable_by?.length) {
      const lab = document.createElement("span"); lab.style.marginLeft = "auto"; lab.textContent = "排序";
      const sel = document.createElement("select");
      const opts = [];
      if (src.supports_favorite) opts.push(["is_favorite:desc,label:asc","收藏优先"]);
      for (const f of src.sortable_by) {
        if (f === "is_favorite") continue;
        opts.push([`${f}:asc`, `${f} ↑`]);
        opts.push([`${f}:desc`,`${f} ↓`]);
      }
      for (const [v,t] of opts) {
        const o = document.createElement("option"); o.value=v; o.textContent=t;
        if (v === stateP.sort) o.selected = true; sel.appendChild(o);
      }
      sel.onchange = () => { stateP.sort = sel.value; load(); };
      row.append(lab, sel);
    }
    head.appendChild(row);
  }
  popupEl.appendChild(head);
  const body = document.createElement("div"); body.className="popup-body"; popupEl.appendChild(body);
  document.body.appendChild(popupEl); qIn.focus();
  let timer;
  qIn.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { stateP.q = qIn.value; stateP.page=1; stateP.expanded={}; load(); }, 200); };

  async function load() {
    body.innerHTML = `<div style="padding:16px;color:var(--muted);">加载中…</div>`;
    if (kind === "hierarchy") {
      const tree = await loadTree(filter, stateP);
      body.innerHTML = "";
      for (const n of tree) body.appendChild(renderHierarchyOpt(filter, n, stateP, load));
    } else {
      const params = baseDropdownParams(filter, stateP); params.page = stateP.page;
      const r = await api(filter.source.endpoint, params);
      body.innerHTML = "";
      for (const it of r.items) body.appendChild(renderFlatOpt(filter, it, stateP));
      if (r.has_more) {
        const m = document.createElement("div"); m.className = "popup-foot";
        m.innerHTML = `<span>第 ${r.page} 页 · 共 ${r.total}</span><span style="flex:1;"></span><span class="more">加载更多 ↓</span>`;
        m.querySelector(".more").onclick = async () => {
          stateP.page++;
          const mr = await api(filter.source.endpoint, {...params, page: stateP.page});
          for (const it of mr.items) body.insertBefore(renderFlatOpt(filter, it, stateP), m);
          if (!mr.has_more) m.remove(); else m.querySelector("span").textContent = `第 ${mr.page} 页 · 共 ${mr.total}`;
        };
        body.appendChild(m);
      }
    }
  }
  load();
}
function baseDropdownParams(filter, stateP) {
  const p = { sort: stateP.sort, only_favorites: stateP.only_favorites?1:0, page_size: filter.source.paging.page_size };
  if (stateP.q) p.q = stateP.q;
  filter.depends_on?.forEach(dep => {
    const v = state.filterValues[dep];
    if (v) p[dep === "region" ? "region_code" : dep] = (v.value || v);
  });
  return p;
}
async function loadTree(filter, stateP) {
  const max = filter.source.max_levels || 99;
  const top = await api(filter.source.endpoint, {...baseDropdownParams(filter, stateP), parent: null});
  const out = [];
  async function walk(items, depth) {
    for (const it of items) {
      out.push({...it, depth});
      // 到达 max_levels 则不再向下展开（即使展开标志为 true）
      if (depth >= max - 1) continue;
      if (stateP.expanded[it.value]) {
        const kids = await api(filter.source.endpoint, {...baseDropdownParams(filter, stateP), parent: it.value});
        await walk(kids.items, depth+1);
      }
    }
  }
  await walk(top.items, 0);
  return out;
}
function renderHierarchyOpt(filter, node, stateP, reload) {
  const row = document.createElement("div"); row.className = "opt";
  const max = filter.source.max_levels || 99;
  const isMaxLeaf = node.depth >= max - 1;
  const canExpand = node.has_children && !isMaxLeaf;
  const canSelect = !node.has_children || isMaxLeaf || filter.source.select_at_any_depth;
  if (state.filterValues[filter.code]?.value === node.value) row.classList.add("sel");
  const indent = document.createElement("span"); indent.className="indent"; indent.style.width=(node.depth*14)+"px";
  row.appendChild(indent);
  const caret = document.createElement("span"); caret.className="caret";
  caret.textContent = canExpand ? (stateP.expanded[node.value] ? "▾" : "▸") : " ";
  if (canExpand) {
    caret.style.cursor = "pointer";
    caret.onclick = (e) => { e.stopPropagation(); stateP.expanded[node.value] = !stateP.expanded[node.value]; reload(); };
  }
  row.appendChild(caret);
  const lbl = document.createElement("span"); lbl.className="lbl"; lbl.textContent = node.label;
  if (!canSelect) lbl.style.color = "var(--muted)";
  row.appendChild(lbl);
  if (node.usage_count != null) {
    const m = document.createElement("span"); m.className="meta"; m.textContent = "用量 "+node.usage_count;
    row.appendChild(m);
  }
  if (filter.source.supports_favorite) row.appendChild(starBtn(node, "region_tree"));
  row.onclick = (e) => {
    if (e.target.closest(".caret") || e.target.closest(".star")) return;
    if (!canSelect) {
      // 不可选的层级（中间分组）—— 点击当作展开
      if (canExpand) { stateP.expanded[node.value] = !stateP.expanded[node.value]; reload(); }
      return;
    }
    state.filterValues[filter.code] = { value: node.value, label: node.label };
    for (const f of state.config.filters) if (f.depends_on?.includes(filter.code)) state.filterValues[f.code] = null;
    closePopup(); renderFilterBar();
  };
  return row;
}
function renderFlatOpt(filter, item, stateP) {
  const row = document.createElement("div"); row.className="opt";
  if (state.filterValues[filter.code]?.value === item.value) row.classList.add("sel");
  const lbl = document.createElement("span"); lbl.className="lbl"; lbl.textContent = item.label;
  row.appendChild(lbl);
  if (item.sales_rank != null) {
    const m = document.createElement("span"); m.className="meta"; m.textContent = "热销 #"+item.sales_rank;
    row.appendChild(m);
  }
  if (filter.source.supports_favorite) row.appendChild(starBtn(item, "product_search"));
  row.onclick = (e) => {
    if (e.target.closest(".star")) return;
    state.filterValues[filter.code] = { value: item.value, label: item.label };
    closePopup(); renderFilterBar();
  };
  return row;
}
function starBtn(item, key) {
  const btn = document.createElement("button");
  btn.className = "star" + (item.is_favorite?" on":"");
  btn.textContent = item.is_favorite ? "★" : "☆";
  btn.title = item.is_favorite ? "取消收藏" : "收藏";
  btn.onclick = async (e) => {
    e.stopPropagation();
    await api(`/api/users/me/favorites/${key}`, {option_value: item.value, favorited: !item.is_favorite});
    item.is_favorite = !item.is_favorite;
    btn.classList.toggle("on", item.is_favorite);
    btn.textContent = item.is_favorite ? "★" : "☆";
    toast(item.is_favorite ? "已收藏 " + item.label : "取消收藏");
  };
  return btn;
}

/* ════════════════════════════════════════════════════════════════════
   Drilldown modal
   ════════════════════════════════════════════════════════════════════ */
const dl = { spec:null, row:null, col:null, page:1, page_size:30, sort:null, rows:[], total:0 };
function openDrilldown(col, row) {
  const ref = col.drilldown?.ref; if (!ref) return;
  dl.spec = state.config.drilldowns[ref]; dl.row = row; dl.col = col;
  dl.page = 1; dl.page_size = dl.spec.paging?.default_page_size ?? 30; dl.sort = null;
  document.getElementById("modalMask").classList.add("show");
  document.getElementById("modalTitle").textContent = interpolate(dl.spec.title, {
    row, filter: state.filterValues, cell: {column: col.code, value: row[col.code]}
  });
  document.getElementById("modalSub").textContent = "数据接口: " + dl.spec.endpoint;
  refreshDrilldown();
}
function closeDrilldown() { document.getElementById("modalMask").classList.remove("show"); }
function interpolate(tpl, ctx) {
  return tpl.replace(/\{([^}]+)\}/g, (_, path) => {
    const parts = path.split(".");
    let v = ctx; for (const p of parts) { v = v?.[p]; if (v == null) return ""; }
    return v ?? "";
  });
}
async function refreshDrilldown() {
  const body = {
    row: dl.row, filter: state.filterValues,
    cell: { column: dl.col.code, value: dl.row[dl.col.code] },
    paging: { page: dl.page, page_size: dl.page_size },
    sort: dl.sort ? `${dl.sort.field}:${dl.sort.dir}` : null
  };
  const r = await api(dl.spec.endpoint, { __body: body });
  dl.rows = r.items; dl.total = r.total;
  renderDrilldownTable();
}
function renderDrilldownTable() {
  const tree = mergeColumns(dl.spec.header_tree, []);
  const { rows, maxDepth } = buildHeaderMatrix(tree);
  const leaves = tree.flatMap(visibleLeaves);
  const t = document.getElementById("modalTable");
  t.className = "grid density-normal"; t.innerHTML = "";
  const thead = document.createElement("thead");
  for (let i=0;i<maxDepth;i++) {
    const tr = document.createElement("tr");
    for (const cell of rows[i]) {
      const th = document.createElement("th");
      if (cell.kind === "leaf") {
        th.classList.add("leaf");
        if (cell.rowSpan > 1) th.rowSpan = cell.rowSpan;
        if (cell.node._pinned === "left") th.classList.add("pin-left");
        if (cell.node.sortable) {
          th.classList.add("sortable");
          if (dl.sort?.field === cell.node.code) th.classList.add("sorted");
        }
        const lbl = document.createElement("span"); lbl.className="label-row";
        lbl.appendChild(document.createTextNode(cell.node.label));
        if (cell.node.sortable) {
          const arr = document.createElement("span"); arr.className="arr";
          arr.textContent = dl.sort?.field === cell.node.code ? (dl.sort.dir==="asc"?"▲":"▼") : "↕";
          lbl.appendChild(arr);
        }
        th.appendChild(lbl);
        if (cell.node.sortable) th.onclick = () => {
          if (dl.sort?.field === cell.node.code) {
            if (dl.sort.dir === "asc") dl.sort.dir = "desc"; else dl.sort = null;
          } else dl.sort = { field: cell.node.code, dir: "asc" };
          refreshDrilldown();
        };
      } else {
        th.colSpan = cell.colSpan;
        th.textContent = cell.node.label;
        th.style.background = "#e9eef7";
      }
      tr.appendChild(th);
    }
    thead.appendChild(tr);
  }
  t.appendChild(thead);
  const tbody = document.createElement("tbody");
  for (const r of dl.rows) {
    const trr = document.createElement("tr");
    for (const c of leaves) {
      const td = document.createElement("td");
      const fm = formatCell(r[c.code], c.display);
      td.className = fm.cls + (c._pinned==="left"?" pin-left":"");
      td.textContent = fm.text;
      trr.appendChild(td);
    }
    tbody.appendChild(trr);
  }
  t.appendChild(tbody);
  document.getElementById("modalRowMeta").textContent = `共 ${dl.total} 行 · 当前 ${dl.rows.length} 行`;
  // pagination
  const totalPages = Math.max(1, Math.ceil(dl.total / dl.page_size));
  const pag = document.getElementById("modalPagination"); pag.innerHTML = "";
  const psSel = document.createElement("select");
  for (const s of [20,30,50,100]) {
    const o = document.createElement("option"); o.value=s; o.textContent=s+"/页";
    if (s === dl.page_size) o.selected = true; psSel.appendChild(o);
  }
  psSel.onchange = () => { dl.page_size = +psSel.value; dl.page = 1; refreshDrilldown(); };
  const prev = document.createElement("button"); prev.className="btn sm"; prev.textContent="‹"; prev.disabled = dl.page<=1;
  prev.onclick = () => { dl.page--; refreshDrilldown(); };
  const next = document.createElement("button"); next.className="btn sm"; next.textContent="›"; next.disabled = dl.page>=totalPages;
  next.onclick = () => { dl.page++; refreshDrilldown(); };
  const info = document.createElement("span"); info.textContent = `${dl.page}/${totalPages}`; info.style.padding = "0 6px";
  pag.append(psSel, prev, info, next);
}

/* ════════════════════════════════════════════════════════════════════
   Column drawer (multi-level)
   ════════════════════════════════════════════════════════════════════ */
function openDrawer() {
  const tree = mergeColumns(state.config.columns.summary.header_tree, USER_PREFS.summary);
  const body = document.getElementById("drawerBody"); body.innerHTML = "";
  function walk(node, lvl) {
    if (node.kind === "leaf") {
      body.appendChild(renderColRow(node, lvl, tree));
      return;
    }
    const head = document.createElement("div");
    head.className = "col-group-head" + (lvl>0?` lvl-${Math.min(lvl,3)}`:"");
    head.innerHTML = `<span>▾</span><span>${node.label}</span><span class="ct">${countVisLeaves(node)} / ${countLeaves(node)}</span>`;
    body.appendChild(head);
    node.children.forEach(c => walk(c, lvl+1));
  }
  tree.forEach(n => walk(n, 0));
  document.getElementById("chkSaveDefault").checked = false;
  document.getElementById("drawerMask").classList.add("show");
  document.getElementById("drawer").classList.add("show");
  document.getElementById("btnDrawerApply").onclick = async () => {
    const flat = []; collectLeaves(tree, flat);
    const items = flat.map(c => ({
      field_code: c.code, is_visible: c._visible, order_idx: c._order, width: c._width, pinned: c._pinned
    }));
    if (document.getElementById("chkSaveDefault").checked) {
      await api(`/api/users/me/columns/daily_sales`, {__method:"PUT", view: "summary", items});
      toast("已保存为我的默认");
    } else {
      USER_PREFS.summary = items; toast("已应用本次会话");
    }
    closeDrawer(); renderTable();
  };
  document.getElementById("btnRestoreDefault").onclick = async () => {
    await api(`/api/users/me/columns/daily_sales`, {__method:"DELETE", view:"summary"});
    toast("已恢复后端默认");
    closeDrawer(); renderTable();
  };
}
function countLeaves(n) {
  if (n.kind === "leaf") return 1;
  return n.children.reduce((s,c) => s + countLeaves(c), 0);
}
function countVisLeaves(n) {
  if (n.kind === "leaf") return n._visible ? 1 : 0;
  return n.children.reduce((s,c) => s + countVisLeaves(c), 0);
}
function collectLeaves(arrOrNode, out) {
  if (Array.isArray(arrOrNode)) { arrOrNode.forEach(x => collectLeaves(x, out)); return; }
  if (arrOrNode.kind === "leaf") out.push(arrOrNode);
  else arrOrNode.children.forEach(x => collectLeaves(x, out));
}
function renderColRow(c, lvl, allTree) {
  const row = document.createElement("div");
  row.className = "col-row" + (lvl>1?` lvl-${Math.min(lvl-1,3)}`:"");
  const cb = document.createElement("input"); cb.type="checkbox"; cb.checked = c._visible;
  cb.onchange = () => { c._visible = cb.checked; openDrawer(); };
  const lbl = document.createElement("span"); lbl.className = "lbl" + (c._visible?"":" dim");
  lbl.textContent = c.label;
  if (!c.is_default_visible) {
    const tag = document.createElement("span"); tag.className="tag"; tag.textContent = "非默认"; tag.style.marginLeft="4px";
    lbl.appendChild(tag);
  }
  const ord = document.createElement("span"); ord.className="ord-btns";
  const up = document.createElement("button"); up.textContent="▲"; up.title="上移";
  const dn = document.createElement("button"); dn.textContent="▼"; dn.title="下移";
  const flat = []; collectLeaves(allTree, flat); flat.sort((a,b)=>a._order-b._order);
  function move(d) {
    const idx = flat.indexOf(c); const tgt = idx + d;
    if (tgt<0 || tgt>=flat.length) return;
    const o = flat[tgt]; [c._order, o._order] = [o._order, c._order];
    openDrawer();
  }
  up.onclick = () => move(-1); dn.onclick = () => move(1);
  ord.append(up, dn);
  const pin = document.createElement("span"); pin.className="pin" + (c._pinned!=="none"?" on":"");
  pin.textContent = c._pinned==="left"?"📌左":c._pinned==="right"?"📌右":"📌";
  pin.title = "钉列 (none → left → right → none)";
  pin.onclick = () => {
    c._pinned = c._pinned==="none" ? "left" : c._pinned==="left" ? "right" : "none";
    pin.textContent = c._pinned==="left"?"📌左":c._pinned==="right"?"📌右":"📌";
    pin.classList.toggle("on", c._pinned !== "none");
  };
  row.append(cb, lbl, ord, pin);
  return row;
}
function closeDrawer() {
  document.getElementById("drawerMask").classList.remove("show");
  document.getElementById("drawer").classList.remove("show");
}

let auditEl = null;
function showAudit(row, col, ev) {
  if (auditEl) auditEl.remove();

  const rect = ev.target.getBoundingClientRect();

    <div style="margin-top:8px;color:var(--muted);">合并规则: <code>latest_valid</code> · 来源优先级 <code>[crm > erp > wms]</code></div>`;
  const ul = auditEl.querySelector("ul");
  for (const a of audit) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="src-badge src-${a.source}">${a.source}</span>
      <span class="ver">v${a.vno}</span>
      <span class="spacer"></span>
      <span class="${a.valid?'ok':'bad'}">${a.valid?'valid':'invalid'}</span>`;
    ul.appendChild(li);
  }
  document.body.appendChild(auditEl);
  setTimeout(() => document.addEventListener("click", _hide), 0);

/* ════════════════════════════════════════════════════════════════════
   Toast
   ════════════════════════════════════════════════════════════════════ */
let toastT = 0;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800);

/* ════════════════════════════════════════════════════════════════════
   Refresh
   ════════════════════════════════════════════════════════════════════ */
function buildFilterParams() {
  const cfg = state.config;
  const params = {};
  for (const f of cfg.filters) {
    const v = state.filterValues[f.code];
    if (v == null) continue;
    switch (f.kind) {
      case "date_range":
      case "datetime_range":
        if (v.from) params[f.param.from] = v.from;
        if (v.to)   params[f.param.to]   = v.to;
        break;
      case "number_range":
        if (v.from != null) params[f.param.from] = v.from;
        if (v.to   != null) params[f.param.to]   = v.to;
        break;
      case "date_single":
      case "datetime_single":
      case "text":
      case "boolean":
        if (v.value !== "" && v.value != null) params[f.param.value] = v.value;
        break;
      case "multi_select":
      case "multi_search": {
        const arr = Array.isArray(v) ? v : [];
        if (arr.length) params[f.param.value] = arr.map(x => x.value ?? x).join(",");
        break;
      }
      default:
        if (v.value != null) params[f.param.value] = v.value;
        else if (typeof v !== "object") params[f.param.value] = v;
    }
  }
  return params;
}

async function refresh() {
  const cfg = state.config;
  const params = buildFilterParams();
  params.version = state.version;
  // 分页模式：server=传分页参数；client/none=不传，后端返全量；前端再切片
  if (state.pagingMode === "server") {
    params.page = state.page; params.page_size = state.page_size;
  } else {
    params.paging = "none";
  }
  const sorts = [];
  if (cfg.primary_view.row_favorite?.sort_on_top) sorts.push("_row_favorite:desc");
  if (state.sort) sorts.push(`${state.sort.field}:${state.sort.dir}`);
  if (sorts.length) params.sort = sorts.join(",");
  if (state.rowFilters.length) params.row_filter = JSON.stringify(state.rowFilters);

  const r = await api(cfg.primary_view.endpoint, params);
  state.allRows = r.items;
  state.totals = r.extras?.totals ?? null;
  state.version_used = r.version_used;
  // 前端切片
  if (state.pagingMode === "client") {
    state.total = r.items.length;
    const start = (state.page - 1) * state.page_size;
    state.rows = r.items.slice(start, start + state.page_size);
  } else if (state.pagingMode === "none") {
    state.total = r.items.length;
    state.rows = r.items;
  } else {
    state.total = r.total;
    state.rows = r.items;
  }
  renderKpi();
  renderTable();
}

/* ════════════════════════════════════════════════════════════════════
   Bootstrap
   ════════════════════════════════════════════════════════════════════ */
async function applyPreset(key) {
  CURRENT_PRESET = key;
  state.config = PRESETS[key];
  state.filterValues = {}; state.rowFilters = []; state.sort = null; state.page = 1;
  for (const f of state.config.filters) {
    if (f.default != null) {
      // multi_select 默认是数组形态
      if (f.kind === "multi_select" || f.kind === "multi_search") {
        state.filterValues[f.code] = Array.isArray(f.default.value) ? f.default.value.map(v => ({value:v,label:v})) : [];
      } else if (typeof f.default === "object") {
        state.filterValues[f.code] = {...f.default};
      } else {
        state.filterValues[f.code] = { value: f.default };
      }
    }
  }
  renderTitle(); renderFilterBar(); await refresh();
}

(async function init() {
  state.config = PRESETS[CURRENT_PRESET];
  for (const f of state.config.filters) if (f.default) state.filterValues[f.code] = {...f.default};
  state.page_size = state.config.primary_view.paging.default_page_size;
  await loadVersionList();
  renderTitle(); renderFilterBar(); renderVersionPill();
  await refresh();

  // density
  document.getElementById("density").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.density = b.dataset.d;
    document.querySelectorAll("#density button").forEach(x => x.classList.toggle("on", x === b));
    document.getElementById("table").className = "grid density-" + state.density;
  });
  document.getElementById("btnCols").onclick = openDrawer;
  document.getElementById("btnDrawerClose").onclick = closeDrawer;
  document.getElementById("btnDrawerCancel").onclick = closeDrawer;
  document.getElementById("drawerMask").onclick = closeDrawer;
  document.getElementById("btnModalClose").onclick = closeDrilldown;
  document.getElementById("modalMask").addEventListener("click", e => {
    if (e.target.id === "modalMask") closeDrilldown();
  });
  document.getElementById("verPill").onclick = openVersionPopup;
  document.getElementById("btnPreset").onclick = openPresetPopup;
  document.getElementById("vtPill").onclick = openViewTemplatePopup;
  document.getElementById("btnTree").onclick = async () => {
    state.treeMode = !state.treeMode;
    document.getElementById("btnTree").classList.toggle("primary", state.treeMode);
    // 切到树状时强制把全量行拉一次（如果之前是服务端分页）
    if (state.treeMode && state.pagingMode === "server") {
      state.pagingMode = "client";
      document.getElementById("pagingMode").value = "client";
      toast("树状模式 · 自动切到 客户端分页 (后端返全量)");
    }
    await refresh();
  };
  document.getElementById("pagingMode").addEventListener("change", async e => {
    state.pagingMode = e.target.value;
    state.page = 1;
    await refresh();
  });
  window.addEventListener("resize", measureHeaderHeights);
})();

/* ════════════════════════════════════════════════════════════════════
   View templates —— 顶栏 🎨 视图
   ════════════════════════════════════════════════════════════════════ */
async function openViewTemplatePopup() {
  closePopup();
  const rect = document.getElementById("vtPill").getBoundingClientRect();
  popupEl = document.createElement("div"); popupEl.className = "popup";
  popupEl.style.left = (rect.right - 360) + "px";
  popupEl.style.top  = (rect.bottom + 6) + "px";
  popupEl.style.minWidth = "360px";

  // 从"后端"拉取自定义模板
  const remote = await api("/api/view_templates/daily_sales");
  popupEl.innerHTML = `
    <div class="popup-head"><div class="row">
      <b style="color:var(--text);">视图模板</b>
      <span class="audit-mini-help">前端内置 + 后端动态返回；切换即应用列/密度/分页/树状/KPI</span>
    </div></div>
    <div style="padding:6px 0;">
      <div style="padding:4px 12px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;">内置 (前端)</div>
      <div id="vtBuiltin"></div>
      <div style="padding:4px 12px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:6px;">从后端拉取</div>
      <div id="vtRemote"></div>
    </div>`;
  document.body.appendChild(popupEl);
  fill(popupEl.querySelector("#vtBuiltin"), VIEW_TEMPLATES.builtin);
  fill(popupEl.querySelector("#vtRemote"),  remote.items);

  function fill(host, list) {
    for (const t of list) {
      const o = document.createElement("div"); o.className = "opt";
      if (t.code === CURRENT_VIEW_TEMPLATE) o.classList.add("sel");
      const lbl = document.createElement("span"); lbl.className = "lbl";
      lbl.innerHTML = `<b>${t.name}</b><div class="meta">${describeTemplate(t)}</div>`;
      const tag = document.createElement("span");
      tag.className = t.source === "backend" ? "badge-rem" : "badge-loc";
      tag.style.padding = "1px 6px"; tag.style.borderRadius = "3px"; tag.style.fontSize = "10px";
      tag.textContent = t.source === "backend" ? "后端" : "内置";
      o.append(lbl, tag);
      o.onclick = async () => { closePopup(); await applyViewTemplate(t); };
      host.appendChild(o);
    }
  }
}
function describeTemplate(t) {
  const c = t.config; const bits = [];
  bits.push(`密度: ${c.density}`);
  bits.push(`分页: ${c.paging_mode || "server"}/${c.page_size || 50}`);
  if (c.tree_mode) bits.push("树状");
  if (c.show_kpi)  bits.push("KPI");
  if (c.only_columns) bits.push(`${c.only_columns.length} 列`);
  if (c.default_sort)  bits.push(`默认排序: ${c.default_sort.field}:${c.default_sort.dir}`);
  return bits.join(" · ");
}
async function applyViewTemplate(t) {
  CURRENT_VIEW_TEMPLATE = t.code;
  const c = t.config;
  state.density = c.density || "normal";
  state.pagingMode = c.paging_mode || "server";
  state.page_size  = c.page_size  || 50;
  state.treeMode   = !!c.tree_mode;
  state.showKpi    = !!c.show_kpi;
  state.page = 1;
  // sync UI controls
  document.querySelectorAll("#density button").forEach(b => b.classList.toggle("on", b.dataset.d === state.density));
  document.getElementById("pagingMode").value = state.pagingMode;
  document.getElementById("btnTree").classList.toggle("primary", state.treeMode);
  document.getElementById("vtLabel").textContent = t.name;
  const src = document.getElementById("vtSrc");
  src.className = t.source === "backend" ? "badge-rem" : "badge-loc";
  src.textContent = t.source === "backend" ? "后端" : "内置";
  // only_columns 覆盖
  if (c.only_columns) {
    const order = c.only_columns;
    const allLeaves = [];
    function walk(n) { if (!n.children) allLeaves.push(n); else n.children.forEach(walk); }
    state.config.columns.summary.header_tree.forEach(walk);
    USER_PREFS.summary = allLeaves.map(l => {
      const idx = order.indexOf(l.code);
      return {
        field_code: l.code,
        is_visible: idx >= 0,
        order_idx: idx >= 0 ? idx + 1 : 999,
        pinned: l.default_pinned ?? "none"
      };
    });
  } else {
    USER_PREFS.summary = [];   // 恢复后端默认
  }
  if (c.default_sort) state.sort = { ...c.default_sort };
  toast("已应用视图：" + t.name);
  await refresh();
}

  closePopup();
