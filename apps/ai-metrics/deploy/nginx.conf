# Nginx 反向代理 + 静态前端（可选）
# 把 ai-metrics 挂在 80 端口的 /ai-metrics/ 路径下。
#
# 装到：/etc/nginx/sites-available/ai-metrics
# 启用：sudo ln -s /etc/nginx/sites-available/ai-metrics /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;     # 任意域名/IP

    location /ai-metrics/ {
        # 去掉前缀转给 uvicorn
        rewrite ^/ai-metrics/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
