# 离线 / 内网 docker-compose（无 db 服务，连 host 上已有的 mysql）
#
# 用法：
#   cp deploy/.env.offline.example deploy/.env.offline
#   编辑 deploy/.env.offline 填内网源和 host mysql 连接串
#   bash deploy/deploy-offline.sh up
#
# 与 docker-compose.yml 的区别：
#   - 不起 mysql:8.0 容器，DB 连 host.docker.internal:3306 (host 上 mysql 5.7)
#   - 不下载 vue/react CDN，HTML 引 frontend/vendor 本地 JS
#   - 不装任何 apt 包，只走内网 pip 源
#   - 不需要 nginx，FastAPI 自身服务静态文件

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.offline
      args:
        PYTHON_IMAGE:     "${PYTHON_IMAGE:-python:3.12-slim}"
        PIP_INDEX_URL:    "${PIP_INDEX_URL}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST-}"
    image: ai-metrics:${IMAGE_TAG:-offline}
    container_name: ai-metrics-api-offline
    restart: unless-stopped
    extra_hosts:
      # Linux 上必须显式声明 host-gateway 别名，容器内才能用 host.docker.internal
      - "host.docker.internal:host-gateway"
    environment:
      # DATABASE_URL 指向 host 上 mysql 5.7（必填）
      # 例：mysql+pymysql://ai_metrics:pwd@host.docker.internal:3306/ai_metrics?charset=utf8mb4
      DATABASE_URL: "${DATABASE_URL}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    ports:
      - "${APP_PORT:-8001}:8001"
