# 离线 / 内网 docker-compose（无 db 服务，连 host 上已有的 mysql）
#
# 用法：
#   cp deploy/.env.offline.example deploy/.env.offline
#   编辑 deploy/.env.offline 填内网源和 host mysql 连接串
#   bash deploy/deploy-offline.sh up
#
# V4 拓扑：
#   api        :8001  →  app.main_query:app       (只读 + UI 静态；不挂 admin/ingest)
#   generation :8002  →  app.main_generation:app  (admin + ingest + admin UI + APScheduler)
#
# admin UI 必须从 :8002/admin/ 打开（与 admin API 同 origin，无 CORS / 无端口推断）

x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile.offline
    args:
      PYTHON_IMAGE:     "${PYTHON_IMAGE:-python:3.12-slim}"
      PIP_INDEX_URL:    "${PIP_INDEX_URL}"
      PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST-}"
  image: ai-metrics:${IMAGE_TAG:-offline}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &common-env
    DATABASE_URL: "${DATABASE_URL}"
    CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    ADMIN_TOKEN:  "${ADMIN_TOKEN-}"
    QUERY_URL:    "${QUERY_URL-}"
    GENERATION_URL: "${GENERATION_URL-}"

services:
  # 报表查询服务 (read-only)
  api:
    <<: *common
    container_name: ai-metrics-api-offline
    command: ["uvicorn", "app.main_query:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]
    ports:
      - "${APP_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/api/healthz', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  # 报表生成服务 (write + scheduler)
  # ⚠ 必须 --workers 1：APScheduler 在每个 worker 内独立跑，多 worker 会让 simulate × N 倍写入
  generation:
    <<: *common
    container_name: ai-metrics-gen-offline
    command: ["uvicorn", "app.main_generation:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1"]
    environment:
      <<: *common-env
      SIM_CRON:       "${SIM_CRON:-0 */2 * * *}"
      PREAGG_CRON:    "${PREAGG_CRON:-10 */2 * * *}"
      SIM_DAYS_BACK:  "${SIM_DAYS_BACK:-1}"
      SIM_RUNS_PER_CALL: "${SIM_RUNS_PER_CALL:-1}"
    ports:
      - "${GEN_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/healthz', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
