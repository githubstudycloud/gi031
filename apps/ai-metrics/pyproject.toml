[project]
name = "ai-metrics"
version = "0.1.0"
description = "AI 测试度量看板 — FastAPI + SQLAlchemy + 多 DB 解耦"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi >= 0.115",
  "uvicorn[standard] >= 0.30",
  "sqlalchemy >= 2.0",
  "alembic >= 1.13",
  "pydantic >= 2.7",
  "pydantic-settings >= 2.4",
  "python-multipart >= 0.0.9",
]

[project.optional-dependencies]
mysql      = ["pymysql >= 1.1", "cryptography >= 42"]
postgres   = ["psycopg[binary] >= 3.2"]
dev        = ["pytest >= 8", "httpx >= 0.27", "ruff >= 0.6"]

[build-system]
requires = ["setuptools >= 68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.services", "app.seed"]

[tool.ruff]
line-length = 110
